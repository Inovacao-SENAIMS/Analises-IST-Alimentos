<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dados pessoais | SENAI FIEMS</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body class="app-layout">
    <div class="app-frame">
      <div data-componente="sidebar" data-pagina-ativa="perfil"></div>

      <main class="content-area">
        <div class="mobile-topbar">
          <button class="mobile-menu-button" data-sidebar-toggle type="button" aria-label="Abrir menu">☰</button>
          <img class="senai-logo" src="../design/brand/logo_senai_fiems.png" alt="SENAI FIEMS">
        </div>

        <div class="content-inner">
          <a class="back-link" href="menu.html">← Voltar aos serviços</a>
          <p class="eyebrow">Minha conta</p>
          <h1 class="page-heading">Dados pessoais</h1>
          <p class="page-lead">Confira os dados vinculados ao seu acesso.</p>
          <div id="perfil-status" class="status" role="alert"></div>

          <section class="card profile-card">
            <div class="profile-avatar" data-usuario-inicial>U</div>
            <div class="profile-fields">
              <div>
                <span>Nome</span>
                <strong data-perfil-nome>Carregando…</strong>
              </div>
              <div>
                <span>E-mail</span>
                <strong data-perfil-email>Carregando…</strong>
              </div>
              <div>
                <span>Grupo de acesso</span>
                <strong class="role-pill" data-perfil-grupo>Carregando…</strong>
              </div>
            </div>
          </section>

          <div data-componente="footer"></div>
        </div>
      </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../components/componentes.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/perfil.js"></script>
  </body>
</html>
