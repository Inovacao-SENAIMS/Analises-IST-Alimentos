<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar acesso | SENAI FIEMS</title>
    <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../design/components/favicon/favicon_logo.png">
  </head>
  <body class="login-page">
    <main class="card login-card cadastro-card">
      <img class="senai-logo login-logo" src="../design/brand/logo_senai_fiems.png" alt="SENAI FIEMS">
      <p class="eyebrow">Portal de serviços</p>
      <h1 class="page-heading">Crie seu acesso</h1>
      <p class="page-lead">Cadastre seus dados para solicitar serviços de análise de sementes.</p>

      <div id="cadastro-status" class="status" role="alert"></div>

      <form id="cadastro-form" novalidate>
        <fieldset class="field profile-selector">
          <legend>Tipo de usuário <span>*</span></legend>
          <div class="radio-group profile-selector-options">
            <label class="choice profile-choice profile-choice--colaborador">
              <input type="radio" name="tipoUsuario" value="COLABORADOR_SENAI" required>
              <span><strong>Colaborador SENAI</strong><small>Navegue e consulte os serviços.</small></span>
            </label>
            <label class="choice profile-choice profile-choice--cliente">
              <input type="radio" name="tipoUsuario" value="CLIENTE">
              <span><strong>Cliente</strong><small>Envie solicitações e cadastre sua empresa.</small></span>
            </label>
          </div>
        </fieldset>
        <div class="field">
          <label for="nome">Nome completo <span>*</span></label>
          <input id="nome" name="nome" autocomplete="name" required>
          <small class="error-message"></small>
        </div>
        <section id="cliente-cadastro" hidden>
          <h2 class="section-title">Dados da empresa</h2>
          <div class="cadastro-cliente-grid">
            <div class="cadastro-cliente-linha cadastro-cliente-linha--razao"><div class="field"><label>Razão Social <span>*</span></label><input name="razaoSocial" autocomplete="organization"></div></div>
            <div class="cadastro-cliente-linha"><div class="field"><label>Nome Fantasia <span>*</span></label><input name="nomeFantasia"></div></div>
            <div class="cadastro-cliente-linha"><div class="field"><label>Endereço <span>*</span></label><input name="endereco" autocomplete="street-address"></div></div>
            <div class="cadastro-cliente-linha cadastro-cliente-linha--tripla">
              <div class="field"><label for="cidade">Cidade <span>*</span></label><input id="cidade" name="cidade" list="cidades-brasil" autocomplete="address-level2"><small>Selecione uma sugestão ou digite a cidade.</small></div>
              <div class="field"><label for="estado">Estado <span>*</span></label><select id="estado" name="estado" autocomplete="address-level1"><option value="">Selecione</option><option value="AC">Acre</option><option value="AL">Alagoas</option><option value="AP">Amapá</option><option value="AM">Amazonas</option><option value="BA">Bahia</option><option value="CE">Ceará</option><option value="DF">Distrito Federal</option><option value="ES">Espírito Santo</option><option value="GO">Goiás</option><option value="MA">Maranhão</option><option value="MT">Mato Grosso</option><option value="MS">Mato Grosso do Sul</option><option value="MG">Minas Gerais</option><option value="PA">Pará</option><option value="PB">Paraíba</option><option value="PR">Paraná</option><option value="PE">Pernambuco</option><option value="PI">Piauí</option><option value="RJ">Rio de Janeiro</option><option value="RN">Rio Grande do Norte</option><option value="RS">Rio Grande do Sul</option><option value="RO">Rondônia</option><option value="RR">Roraima</option><option value="SC">Santa Catarina</option><option value="SP">São Paulo</option><option value="SE">Sergipe</option><option value="TO">Tocantins</option></select></div>
              <div class="field"><label for="cep">CEP <span>*</span></label><input id="cep" name="cep" inputmode="numeric" autocomplete="postal-code" placeholder="00.000-000"></div>
            </div>
            <div class="cadastro-cliente-linha cadastro-cliente-linha--tripla">
              <div class="field"><label for="cpf-cnpj">CPF / CNPJ <span>*</span></label><input id="cpf-cnpj" name="cpfCnpj" inputmode="numeric" placeholder="000.000.000-00"></div>
              <div class="field"><label for="inscricao-estadual-rg">Inscrição Estadual / RG <span>*</span></label><input id="inscricao-estadual-rg" name="inscricaoEstadualRg" placeholder="00.000.000-0"></div>
              <div class="field"><label for="renasem">RENASEM</label><input id="renasem" name="renasem"><small>Aplicável a ensaios de sementes.</small></div>
            </div>
            <div class="cadastro-cliente-linha cadastro-cliente-linha--tripla">
              <div class="field"><label>Ramo de Atividade <span>*</span></label><input name="ramoAtividade"></div>
              <div class="field"><label>Número de Funcionários <span>*</span></label><input name="numeroFuncionarios" type="number" min="1"></div>
              <div class="field"><label for="telefone">Telefone <span>*</span></label><input id="telefone" name="telefone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"></div>
            </div>
          </div>
          <datalist id="cidades-brasil"></datalist>
          <h2 class="section-title">Contatos</h2>
          <div id="contatos-cliente"></div>
          <button class="button contact-add-button" id="adicionar-contato" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Adicionar contato</button>
        </section>
        <div class="field">
          <label for="email">E-mail <span>*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <small class="error-message"></small>
        </div>
        <div class="field">
          <label for="senha">Defina uma senha <span>*</span></label>
          <input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required>
          <small class="error-message">Mínimo de 8 caracteres.</small>
        </div>
        <div class="field">
          <label for="confirmar-senha">Confirme a senha <span>*</span></label>
          <input id="confirmar-senha" name="confirmarSenha" type="password" minlength="8" autocomplete="new-password" required>
          <small class="error-message"></small>
        </div>
        <button class="button primary" type="submit">Criar acesso</button>
      </form>

      <p class="form-footer">Já possui acesso? <a href="index.html">Voltar para o login</a></p>
    </main>

    <div data-componente="footer"></div>

    <script src="../js/config.js"></script>
    <script src="../components/componentes.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cadastro.js"></script>
  </body>
</html>
