<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar acesso | SENAI FIEMS</title>
    <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../design/components/favicon/favicon_logo.png">
  </head>
  <body class="login-page">
    <main class="card login-card cadastro-card">
      <img class="senai-logo login-logo" src="../design/brand/logo_senai_fiems.png" alt="SENAI FIEMS">
      <p class="eyebrow">Portal de serviços</p>
      <h1 class="page-heading">Crie seu acesso</h1>
      <p class="page-lead">Cadastre seus dados para solicitar serviços de análise de sementes.</p>

      <div id="cadastro-status" class="status" role="alert"></div>

      <form id="cadastro-form" novalidate>
        <fieldset class="field profile-selector">
          <legend>Tipo de usuário <span>*</span></legend>
          <div class="radio-group profile-selector-options">
            <label class="choice profile-choice profile-choice--colaborador">
              <input type="radio" name="tipoUsuario" value="COLABORADOR_SENAI" required>
              <span><strong>Colaborador SENAI</strong><small>Navegue e consulte os serviços.</small></span>
            </label>
            <label class="choice profile-choice profile-choice--cliente">
              <input type="radio" name="tipoUsuario" value="CLIENTE">
              <span><strong>Cliente</strong><small>Envie solicitações e cadastre sua empresa.</small></span>
            </label>
          </div>
        </fieldset>
        <div class="field">
          <label for="nome">Nome completo <span>*</span></label>
          <input id="nome" name="nome" autocomplete="name" required>
          <small class="error-message"></small>
        </div>
        <section id="cliente-cadastro" hidden>
          <h2 class="section-title">Dados da empresa</h2>
          <div class="field-grid cadastro-cliente-grid">
            <div class="field field--wide"><label>Razão Social <span>*</span></label><input name="razaoSocial"></div>
            <div class="field"><label>Nome Fantasia <span>*</span></label><input name="nomeFantasia"></div>
            <div class="field"><label>RENASEM</label><input name="renasem"><small>Aplicável a ensaios de sementes.</small></div>
            <div class="field field--wide"><label>Endereço <span>*</span></label><input name="endereco"></div>
            <div class="field"><label>Cidade <span>*</span></label><input name="cidade"></div>
            <div class="field"><label>Estado <span>*</span></label><input name="estado"></div>
            <div class="field"><label>CEP <span>*</span></label><input name="cep"></div>
            <div class="field"><label>Telefone <span>*</span></label><input name="telefone"></div>
            <div class="field"><label>CNPJ / CPF <span>*</span></label><input name="cpfCnpj"></div>
            <div class="field"><label>Inscrição Estadual / RG <span>*</span></label><input name="inscricaoEstadualRg"></div>
            <div class="field field--wide"><label>Ramo de Atividade <span>*</span></label><input name="ramoAtividade"></div>
            <div class="field"><label>Número de Funcionários <span>*</span></label><input name="numeroFuncionarios" type="number" min="1"></div>
          </div>
          <h2 class="section-title">Contatos</h2>
          <div id="contatos-cliente"></div>
          <button class="button contact-add-button" id="adicionar-contato" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Adicionar contato</button>
        </section>
        <div class="field">
          <label for="email">E-mail <span>*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <small class="error-message"></small>
        </div>
        <div class="field">
          <label for="senha">Defina uma senha <span>*</span></label>
          <input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required>
          <small class="error-message">Mínimo de 8 caracteres.</small>
        </div>
        <div class="field">
          <label for="confirmar-senha">Confirme a senha <span>*</span></label>
          <input id="confirmar-senha" name="confirmarSenha" type="password" minlength="8" autocomplete="new-password" required>
          <small class="error-message"></small>
        </div>
        <button class="button primary" type="submit">Criar acesso</button>
      </form>

      <p class="form-footer">Já possui acesso? <a href="index.html">Voltar para o login</a></p>
    </main>

    <div data-componente="footer"></div>

    <script src="../js/config.js"></script>
    <script src="../components/componentes.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cadastro.js"></script>
  </body>
</html>
