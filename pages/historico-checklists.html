<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico de checklists | SENAI FIEMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../design/components/favicon/favicon_logo.png">
  </head>
  <body class="app-layout">
    <div class="app-frame">
      <div data-componente="sidebar" data-pagina-ativa="checklists"></div>

      <main class="content-area">
        <div class="mobile-topbar">
          <button class="mobile-menu-button" data-sidebar-toggle type="button" aria-label="Abrir menu">☰</button>
          <img class="senai-logo" src="../design/brand/senai_alimentos.jpeg" alt="SENAI FIEMS">
        </div>

        <div class="content-inner">
          <p class="eyebrow">Recebimento</p>
          <h1 class="page-heading">Histórico de checklists</h1>
          <p class="page-lead">Consulte os checklists de recebimento registrados e baixe o comprovante em PDF.</p>
          <div id="checklists-status" class="status" role="alert"></div>

          <section class="card history-card">
            <div class="history-toolbar">
              <label class="history-search">
                <span>Pesquisar</span>
                <input id="checklists-search" type="search" placeholder="Checklist, análise, usuário ou cliente">
              </label>
              <button id="checklists-refresh" class="button secondary" type="button">Atualizar</button>
              <div data-componente="botao-exportar-resumo" data-id="checklists-export-summary"></div>
            </div>
            <div class="history-table-wrap">
              <table class="history-table">
                <thead>
                  <tr>
                    <th>Checklist</th>
                    <th>Referência</th>
                    <th>Número da Análise</th>
                    <th>Usuário</th>
                    <th>Requerente/Cliente</th>
                    <th>Recebimento</th>
                    <th>Situação</th>
                    <th>Ação</th>
                  </tr>
                </thead>
                <tbody id="checklists-body"></tbody>
              </table>
              <p id="checklists-empty" class="history-empty" hidden>Nenhum checklist encontrado.</p>
            </div>
          </section>

          <div data-componente="footer"></div>
        </div>
      </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../components/componentes.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../components/pdf-relatorios.js"></script>
    <script src="../js/historico-checklists.js"></script>
  </body>
</html>
