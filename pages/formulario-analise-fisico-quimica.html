<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Solicitação de Análise Físico-Química | SENAI FIEMS</title><link rel="stylesheet" href="../css/style.css"></head><body><div data-componente="form-header"></div><main class="app-shell page"><div data-componente="botao-voltar-menu" data-classe="form-back-button"></div><p class="eyebrow">Serviço físico-químico</p><h1 class="page-heading">Solicitação de Análise Físico-Química</h1><div id="fq-status" class="status" role="alert"></div><form id="fisico-quimico-form" novalidate>
<section class="form-section"><div class="section-heading"><span class="section-number">1</span><div><h2 class="section-title">Origem e Dados do Cliente</h2><p class="section-description">Campos obrigatórios.</p></div></div><div class="field-grid"><div class="field full"><label>Origem <span>*</span></label><div class="radio-group"><label class="choice"><input type="radio" name="origem" value="WhatsApp" required>WhatsApp</label><label class="choice"><input type="radio" name="origem" value="QR Code (Recepção)">QR Code (Recepção)</label><label class="choice"><input type="radio" name="origem" value="E-mail">E-mail</label><label class="choice"><input type="radio" name="origem" value="Outros">Outros</label></div></div><div id="origem-outros-wrap" class="field" hidden><label>Especifique <input name="origemOutros"></label></div><div class="field"><label>Razão Social <span>*</span><input name="razaoSocial" required></label></div><div class="field"><label>CNPJ/CPF <span>*</span><input id="fq-cpf" name="cpfCnpj" required></label></div><div class="field"><label>E-mail <span>*</span><input name="email" type="email" required></label></div><div class="field"><label>Telefone <span>*</span><input name="telefone" required></label></div></div></section>
<section class="form-section"><div class="section-heading"><span class="section-number">2</span><div><h2 class="section-title">Amostra</h2></div></div><div class="field-grid"><div class="field"><label>Tipo de amostra<input name="tipoAmostra" type="text"></label></div><div class="field"><label>Lote<input name="lote" type="text"></label></div><div class="field"><label>Lacre<input name="lacre" type="text"></label></div><div class="field"><label>Data de produção<input name="dataProducao" type="date"></label></div><div class="field"><label>Hora da produção<input name="horaProducao" type="time"></label></div><div class="field"><label>Data de validade<input name="dataValidade" type="date"></label></div><div class="field"><label>Local da coleta<input name="localColeta" type="text"></label></div><div class="field"><label>Data da coleta<input name="dataColeta" type="date"></label></div><div class="field"><label>Hora da coleta<input name="horaColeta" type="time"></label></div><div class="field"><label>Temperatura da coleta (°C)<input name="temperaturaColeta" type="number"></label></div><div class="field"><label>Responsável pela coleta<input name="responsavelColeta" type="text"></label></div></div><fieldset class="field full"><legend class="legend-label">Finalidade <span>*</span></legend><div class="radio-group"><label class="choice"><input type="radio" name="finalidade" value="Controle de Qualidade" required>Controle de Qualidade</label><label class="choice"><input type="radio" name="finalidade" value="Amostra Fiscal">Amostra Fiscal</label><label class="choice"><input type="radio" name="finalidade" value="Outros">Outros</label></div></fieldset><div id="finalidade-outros-wrap" class="field" hidden><label>Especifique <input name="finalidadeOutros"></label></div><fieldset class="field full"><legend class="legend-label">SEBRAETEC <span>*</span></legend><label class="choice"><input type="radio" name="sebraetec" value="SIM" required>SIM</label><label class="choice"><input type="radio" name="sebraetec" value="NÃO">NÃO</label></fieldset></section>
<section class="form-section"><div class="section-heading"><span class="section-number">3</span><div><h2 class="section-title">Matriz de Análise</h2></div></div><div class="radio-group"><label class="choice"><input type="radio" name="matriz" value="aguaGelo" required>Água e Gelo</label><label class="choice"><input type="radio" name="matriz" value="carnesPescados" required>Carnes, Pescados e Derivados</label><label class="choice"><input type="radio" name="matriz" value="leiteOvos" required>Leite, Ovos e Derivados</label><label class="choice"><input type="radio" name="matriz" value="melApicolas" required>Mel e Produtos Apícolas</label><label class="choice"><input type="radio" name="matriz" value="alimentosBebidas" required>Alimentos, Bebidas e Matéria-Prima para Alimentação Animal</label><label class="choice"><input type="radio" name="matriz" value="Outros" required>Outros</label></div><div id="matriz-outros-wrap" class="field" hidden><label>Informe a Matriz <input name="matrizOutros"></label></div><div id="fisico-quimico-ensaios" class="micro-assay-groups"></div><small id="fisico-quimico-ensaios-error" class="error-message"></small></section>
<section class="form-section"><div class="field"><label>Observações Adicionais<textarea name="observacoes"></textarea></label></div><label class="choice"><input type="checkbox" name="confirmacao" required>Confirmo que os Dados Informados e os Ensaios Selecionados estão corretos.</label><fieldset class="field"><legend class="legend-label">Autoriza ensaios por tempo acima do limite? <span>*</span></legend><label class="choice"><input type="radio" name="autorizaTempo" value="SIM" required>SIM</label><label class="choice"><input type="radio" name="autorizaTempo" value="NÃO">NÃO</label></fieldset><fieldset class="field"><legend class="legend-label">Autoriza ensaios por temperatura fora do limite? <span>*</span></legend><label class="choice"><input type="radio" name="autorizaTemperatura" value="SIM" required>SIM</label><label class="choice"><input type="radio" name="autorizaTemperatura" value="NÃO">NÃO</label></fieldset></section><div class="form-actions"><div data-componente="botao-enviar" data-id="fq-submit"></div><div data-componente="botao-baixar-pdf" data-id="fq-pdf"></div><div data-componente="botao-limpar" data-id="fq-clear"></div></div></form><div data-componente="footer"></div></main><script src="../js/config.js"></script><script src="../components/componentes.js"></script><script src="../js/auth.js"></script><script src="../js/validacoes.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="../components/pdf-relatorios.js"></script><script src="../js/form-analise-fisico-quimica.js"></script></body></html>
