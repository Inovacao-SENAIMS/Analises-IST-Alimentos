<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | SENAI FIEMS</title>
    <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../design/components/favicon/favicon_logo.png">
  </head>
  <body class="app-layout">
    <div class="app-frame">
      <div data-componente="sidebar" data-pagina-ativa="clientes"></div>

      <main class="content-area">
        <div class="mobile-topbar">
          <button class="mobile-menu-button" data-sidebar-toggle type="button" aria-label="Abrir menu">☰</button>
          <img class="senai-logo" src="../design/brand/senai_alimentos.jpeg" alt="SENAI FIEMS">
        </div>

        <div class="content-inner">
          <p class="eyebrow">Gestão</p>
          <h1 class="page-heading">Clientes</h1>
          <p class="page-lead">Consulte todos os cadastros de clientes do portal e acesse os dados detalhados de cada um.</p>
          <div id="clientes-status" class="status" role="alert"></div>

          <section class="card admin-card">
            <form id="clientes-filtros" class="docs-filters" novalidate>
              <div class="field">
                <label for="clientes-busca">Buscar</label>
                <input id="clientes-busca" type="search" placeholder="Nome, e-mail, razão social ou CPF/CNPJ" autocomplete="off">
              </div>
              <div class="field">
                <label for="clientes-tipo">Tipo de pessoa</label>
                <select id="clientes-tipo">
                  <option value="">Todos</option>
                  <option value="FISICA">Pessoa física</option>
                  <option value="JURIDICA">Pessoa jurídica</option>
                </select>
              </div>
              <div class="field">
                <label for="clientes-situacao">Situação</label>
                <select id="clientes-situacao">
                  <option value="">Todas</option>
                  <option value="CONCLUIDO">Concluído</option>
                  <option value="PENDENTE">Pendente</option>
                </select>
              </div>
              <div class="docs-filters-action">
                <button id="clientes-refresh" class="button admin-refresh-button" type="button">Atualizar</button>
              </div>
            </form>
            <div class="admin-table-wrap">
              <table class="admin-table clientes-table">
                <thead>
                  <tr>
                    <th>Cliente</th>
                    <th>Razão social</th>
                    <th>Tipo</th>
                    <th>CPF/CNPJ</th>
                    <th>Telefone</th>
                    <th>Cidade/UF</th>
                    <th>Cadastro</th>
                    <th>Situação</th>
                    <th>Ação</th>
                  </tr>
                </thead>
                <tbody id="clientes-body"></tbody>
              </table>
            </div>
            <p id="clientes-empty" class="data-footnote" hidden>Nenhum cliente encontrado.</p>
          </section>

          <div data-componente="footer"></div>
        </div>
      </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../components/componentes.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/lista-clientes.js"></script>
  </body>
</html>
