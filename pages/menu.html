<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serviços | SENAI FIEMS</title>
    <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../design/components/favicon/favicon_logo.png">
  </head>
  <body class="app-layout">
    <div class="app-frame">
      <div data-componente="sidebar" data-pagina-ativa="servicos"></div>

      <main class="content-area">
        <div class="mobile-topbar">
          <button class="mobile-menu-button" data-sidebar-toggle type="button" aria-label="Abrir menu">☰</button>
          <img class="senai-logo" src="../design/brand/logo_senai_fiems.png" alt="SENAI FIEMS">
        </div>

        <div class="content-inner">
          <p class="eyebrow">Área autenticada</p>
          <h1 class="page-heading">Serviços</h1>
          <p class="page-lead">Olá, <strong data-usuario-nome>usuário</strong>. Escolha um serviço para iniciar.</p>
          <section class="cards-grid" data-formularios aria-live="polite"></section>
          <div data-componente="footer"></div>
        </div>
      </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../components/componentes.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/menu.js"></script>
  </body>
</html>
